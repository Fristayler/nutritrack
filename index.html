<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10b981">
    <title>NutriTrack AI — Калькулятор КБЖУ и ИИ-Сканер Еды</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .progress-transition { transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease; }
        .ring-transition { transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.3s ease; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        .ai-scan-line { animation: scanMove 2s infinite ease-in-out; }
        @keyframes scanMove { 0%, 100% { top: 8%; } 50% { top: 88%; } }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24 sm:pb-8 selection:bg-emerald-500 selection:text-white">

    <!-- Верхняя навигационная панель -->
    <header class="bg-white border-b border-slate-200/80 sticky top-0 z-30 backdrop-blur-md bg-white/90">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
                    <i class="ph-fill ph-leaf text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg leading-tight text-slate-900 flex items-center gap-1.5">
                        <span>NutriTrack</span>
                        <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider px-2 py-0.5 bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-full">AI Vision</span>
                    </h1>
                    <p class="text-xs text-slate-500 hidden md:block">Умный планировщик рациона и распознавание КБЖУ по фото</p>
                </div>
            </div>
            
            <div class="flex items-center gap-1.5 sm:gap-2.5">
                <button type="button" onclick="openAiScannerModal()" class="text-xs sm:text-sm font-semibold text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 px-3 sm:px-4 py-2 rounded-xl shadow-sm transition flex items-center gap-1.5 active:scale-95 cursor-pointer">
                    <i class="ph-bold ph-camera text-base"></i>
                    <span>ИИ-Сканер блюда</span>
                </button>
                <button type="button" onclick="loadDemoDay()" class="text-xs sm:text-sm font-medium text-slate-600 hover:text-emerald-600 bg-slate-100 hover:bg-emerald-50 px-2.5 sm:px-3 py-2 rounded-xl transition flex items-center gap-1.5 cursor-pointer" title="Заполнить примером">
                    <i class="ph ph-magic-wand text-base"></i>
                    <span class="hidden md:inline">Пример</span>
                </button>
                <button type="button" onclick="openResetModal()" class="text-xs sm:text-sm font-medium text-rose-600 hover:bg-rose-50 px-2.5 py-2 rounded-xl transition flex items-center gap-1 cursor-pointer" title="Очистить день">
                    <i class="ph ph-trash text-base"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- Левая колонка: Параметры -->
            <div id="section-profile" class="lg:col-span-5 xl:col-span-4 flex flex-col gap-6">
                <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-6">
                    <div class="flex items-center justify-between mb-5">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center">
                                <i class="ph-bold ph-sliders-horizontal text-lg"></i>
                            </div>
                            <h2 class="font-bold text-slate-800 text-base sm:text-lg">Ваши параметры</h2>
                        </div>
                        <span class="text-xs text-slate-400 font-medium">Миффлин — Сан-Жеор</span>
                    </div>

                    <form id="profileForm" class="space-y-4" onsubmit="event.preventDefault();">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Пол</label>
                            <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
                                <button type="button" onclick="setGender('female')" id="btn-gender-female" class="py-2.5 px-3 rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2 cursor-pointer">
                                    <i class="ph-bold ph-gender-female text-base"></i> Женский
                                </button>
                                <button type="button" onclick="setGender('male')" id="btn-gender-male" class="py-2.5 px-3 rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2 cursor-pointer">
                                    <i class="ph-bold ph-gender-male text-base"></i> Мужской
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-3">
                            <div>
                                <label for="input-age" class="block text-xs font-medium text-slate-600 mb-1">Возраст</label>
                                <div class="relative">
                                    <input type="number" id="input-age" min="14" max="100" value="28" oninput="updateProfileFromInputs()"
                                        class="w-full bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:bg-white rounded-xl px-3 py-2 text-sm font-semibold text-slate-800 outline-none transition">
                                    <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none">лет</span>
                                </div>
                            </div>
                            <div>
                                <label for="input-height" class="block text-xs font-medium text-slate-600 mb-1">Рост</label>
                                <div class="relative">
                                    <input type="number" id="input-height" min="120" max="240" value="170" oninput="updateProfileFromInputs()"
                                        class="w-full bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:bg-white rounded-xl px-3 py-2 text-sm font-semibold text-slate-800 outline-none transition">
                                    <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none">см</span>
                                </div>
                            </div>
                            <div>
                                <label for="input-weight" class="block text-xs font-medium text-slate-600 mb-1">Вес</label>
                                <div class="relative">
                                    <input type="number" id="input-weight" min="35" max="250" step="0.5" value="68" oninput="updateProfileFromInputs()"
                                        class="w-full bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:bg-white rounded-xl px-3 py-2 text-sm font-semibold text-slate-800 outline-none transition">
                                    <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none">кг</span>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label for="input-activity" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Уровень активности</label>
                            <div class="relative">
                                <select id="input-activity" onchange="updateProfileFromInputs()"
                                    class="w-full appearance-none bg-slate-50 border border-slate-200 focus:border-emerald-500 rounded-xl px-3.5 py-2.5 pr-9 text-sm font-medium text-slate-800 outline-none transition cursor-pointer">
                                    <option value="1.2">Минимальная (сидячая работа, без спорта)</option>
                                    <option value="1.375" selected>Легкая (1–3 легкие тренировки в неделю)</option>
                                    <option value="1.55">Средняя (3–5 тренировок в неделю)</option>
                                    <option value="1.725">Высокая (6–7 интенсивных тренировок)</option>
                                    <option value="1.9">Экстремальная (тяжелый физ. труд)</option>
                                </select>
                                <i class="ph ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs
